# markweave.cloud 落地页（HTTP → HTTPS）
server {
    listen 80;
    server_name markweave.cloud www.markweave.cloud;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# auth.markweave.cloud 认证服务（HTTP → HTTPS）
server {
    listen 80;
    server_name auth.markweave.cloud;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

