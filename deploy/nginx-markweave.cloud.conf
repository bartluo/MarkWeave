# markweave.cloud 落地页 HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name markweave.cloud www.markweave.cloud;

    ssl_certificate /etc/nginx/ssl/live/markweave.cloud/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/markweave.cloud/privkey.pem;

    location /downloads/ {
        proxy_pass http://172.18.0.1:13080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://172.18.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

